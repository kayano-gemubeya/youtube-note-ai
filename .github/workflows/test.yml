name: YouTube動画収集・ランキング

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  collect-and-rank:
    runs-on: ubuntu-latest

    steps:

      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: YouTube APIキーを確認
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY が設定されていません"
            exit 1
          fi
          echo "YouTube APIキーを確認しました"

      - name: YouTube動画を収集
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python collect.py

      - name: 動画をランキング
        run: |
          python rank.py

      - name: 結果を表示
        run: |
          echo "===== AI候補 ====="
          python -c "import json; d=json.load(open('candidates.json', encoding='utf-8')); print('候補数:', len(d)); [print(f'{i+1}. {x[\"title\"]} | score={x[\"score\"]}') for i,x in enumerate(d)]"

      - name: 結果を保存
        uses: actions/upload-artifact@v4
        with:
          name: youtube-candidates
          path: |
            videos.json
            candidates.json
